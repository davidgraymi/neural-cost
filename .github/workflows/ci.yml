name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check code formatting and linting
        run: uv run --extra dev python scripts/format.py --check

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.14']
        exclude:
          - python-version: '3.14'
            os: ubuntu-latest
          - python-version: '3.14'
            os: macos-latest
        include:
          - os: ubuntu-latest
            python-version: '3.14'
            skip_tensorflow: 'true'
          - os: macos-latest
            python-version: '3.14'
            skip_tensorflow: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (with TensorFlow)
        if: matrix.skip_tensorflow != 'true'
        run: uv sync --extra dev --extra torch --extra jax --extra tensorflow

      - name: Install dependencies (without TensorFlow)
        if: matrix.skip_tensorflow == 'true'
        run: uv sync --extra dev --extra torch --extra jax

      - name: Run tests
        run: uv run --extra dev python -m pytest tests/ -v

  test-core:
    # The core package has zero mandatory dependencies; prove it by running the
    # suite and the CLI with no ML framework or NumPy installed.
    name: Test core (no optional dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install core + test tools only
        run: uv sync --extra dev

      - name: Run tests
        run: uv run --extra dev python -m pytest tests/ -q -rs

      - name: CLI smoke test
        run: uv run neural-cost llm moe --json

  semver-check:
    name: Semantic Version Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Semantic Version Upgrade
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          change_path: "src pyproject.toml"
          search_commit_body: true

      - name: Report SemVer Status
        run: |
          echo "### 🏷️ Semantic Version Pipeline Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Current Version** | \`${{ steps.semver.outputs.previous_version || '0.0.0' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Next Version** | \`${{ steps.semver.outputs.version }}\` (\`${{ steps.semver.outputs.version_tag }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bump Type** | \`${{ steps.semver.outputs.version_type || 'none' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Upgrade Needed?** | \`${{ steps.semver.outputs.changed == 'true' && '✅ Yes (library files changed)' || '❌ No (non-library changes only)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.semver.outputs.changed }}" = "true" ]; then
            echo "🚀 Merging this PR will trigger a **${{ steps.semver.outputs.version_type }}** release (\`${{ steps.semver.outputs.version_tag }}\`) to PyPI." >> $GITHUB_STEP_SUMMARY
          else
            echo "⏩ No library changes or version upgrade required. PyPI release will be skipped on merge." >> $GITHUB_STEP_SUMMARY
          fi
