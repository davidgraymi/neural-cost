[build-system]
requires = ["hatchling>=1.21", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "neural-cost"
dynamic = ["version"]
description = "Theoretical and measured memory/compute analysis for neural networks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neural Cost contributors" }]
keywords = [
  "deep-learning",
  "flops",
  "gap-analysis",
  "hardware-profiling",
  "jax",
  "memory-bandwidth",
  "neural-networks",
  "performance",
  "profiler",
  "pytorch",
  "roofline-model",
  "tensorflow",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Benchmark",
  "Topic :: System :: Hardware",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.0"]
jax = ["jax>=0.4"]
# Apple Silicon JAX GPU plugins — install one of these to run JAX on MPS/Metal.
# jax-metal is Apple's official Metal PJRT plugin (JAX_PLATFORMS=METAL).
# jax-mps is a community PJRT plugin that executes StableHLO through MLX on the
# Apple GPU (JAX_PLATFORMS=mps). It is built against one jaxlib minor version
# (jax-mps 0.11.x requires jax/jaxlib >=0.11,<0.12 and Python >=3.12), so the
# extra pins jax to match instead of letting pip pick an incompatible jax.
# Without a plugin, JAX silently falls back to CPU on Apple Silicon.
jax-metal = ["jax>=0.4", "jax-metal"]
jax-mps = [
  "jax>=0.11,<0.12; python_version >= '3.12'",
  "jaxlib>=0.11,<0.12; python_version >= '3.12'",
  "jax-mps>=0.11,<0.12; python_version >= '3.12'",
]
tensorflow = ["tensorflow>=2.12"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
neural-cost = "neural_cost.cli:main"
neural-cost-compare = "neural_cost.cli:compare_main"

[project.urls]
Homepage = "https://github.com/davidgraymi/neural-cost"
Documentation = "https://github.com/davidgraymi/neural-cost#readme"
Repository = "https://github.com/davidgraymi/neural-cost"
Issues = "https://github.com/davidgraymi/neural-cost/issues"
Changelog = "https://github.com/davidgraymi/neural-cost/releases"
"PyPI" = "https://pypi.org/project/neural-cost/"

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>.*)"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_cost"]

[tool.hatch.build.targets.wheel.force-include]
# The agent skill ships with the package so its version matches the API.
"skills/neural-cost/SKILL.md" = "neural_cost/agent_skill/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
extend-select = ["I", "BLE"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]
